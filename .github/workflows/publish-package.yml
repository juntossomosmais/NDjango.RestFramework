name: Publish package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          # All three, not just the newest: the SDK that builds every target framework is 10, but
          # running the net8.0 and net9.0 test runs needs their runtimes on the agent as well.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Generate package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          dotnet pack -c Release -o out -p:PackageVersion=$TAG_NAME
      - name: Push package
        run: |
          dotnet nuget push out/*.nupkg \
          --api-key ${{ secrets.PUBLIC_NUGET_API_KEY }} \
          --source "https://api.nuget.org/v3/index.json" \
          --skip-duplicate
